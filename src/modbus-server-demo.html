<script type="text/javascript">
  RED.nodes.registerType('modbus-server-demo', {
    category: 'modbus',
    color: '#E9967A',
    defaults: {
      name: {value: ''},
      logEnabled: {value: false},
      hostname: {value: '0.0.0.0'},
      serverPort: {value: 10502, validate: RED.validators.number()},
      responseDelay: {value: 100, validate: RED.validators.number()},
      delayUnit: {value: 'ms'},
      showStatusActivities: {value: false},
      showErrors: {value: false},
      // Buffer sizes
      coilsBufferSize: {value: 10000, validate: RED.validators.number()},
      holdingBufferSize: {value: 10000, validate: RED.validators.number()},
      inputBufferSize: {value: 10000, validate: RED.validators.number()},
      discreteBufferSize: {value: 10000, validate: RED.validators.number()},
      // Demo settings
      demoDataPattern: {value: 'sequential'},
      demoUpdateInterval: {value: 1000, validate: RED.validators.number()},
      demoAutoStart: {value: true},
      demoRandomSeed: {value: null},
      demoValueMin: {value: 0, validate: RED.validators.number()},
      demoValueMax: {value: 65535, validate: RED.validators.number()},
      // Advanced demo features
      demoRealisticMode: {value: false},
      demoDeviceSimulation: {value: 'generic'},
      demoErrorRate: {value: 0, validate: function(v) { return v >= 0 && v <= 1 }}
    },
    inputs: 1,
    outputs: 1,
    icon: "modbus.png",
    paletteLabel: "Modbus-Demo-Server",
    label: function () {
      return this.name || "Modbus Demo Server " + this.serverPort
    },
    info: function () {
      return "Modbus Demo Server with automatic data generation for testing and development."
    }
  })
</script>

<script type="text/x-red" data-help-name="modbus-server-demo">
  <p>Modbus Demo Server with automatic data generation for testing and development.</p>
  
  <h3>Features</h3>
  <ul>
    <li>Automatic demo data generation with multiple patterns</li>
    <li>Realistic device simulation modes</li>
    <li>Configurable value ranges and update intervals</li>
    <li>Error simulation for testing error handling</li>
    <li>Support for all Modbus function codes</li>
    <li>Dynamic configuration via input messages</li>
  </ul>
  
  <h3>Data Generation Patterns</h3>
  <ul>
    <li><b>Sequential</b>: Incrementing counter values</li>
    <li><b>Random</b>: Random values within range (with optional seed)</li>
    <li><b>Sine Wave</b>: Sinusoidal pattern for analog simulation</li>
    <li><b>Square Wave</b>: Alternating high/low values</li>
    <li><b>Sawtooth Wave</b>: Linear ramp up and reset</li>
    <li><b>Mixed</b>: Different patterns for different registers</li>
  </ul>
  
  <h3>Realistic Device Simulations</h3>
  <ul>
    <li><b>Temperature Sensors</b>: Realistic temperature variations (20-30°C)</li>
    <li><b>Pressure Sensors</b>: Atmospheric pressure simulation (950-1050 hPa)</li>
    <li><b>Flow Meters</b>: Flow rate variations (0-1000 L/h)</li>
    <li><b>Motor Controller</b>: RPM, current, and temperature values</li>
    <li><b>PLC Simulation</b>: Mixed digital and analog I/O</li>
  </ul>
  
  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">string | object</span></dt>
    <dd>Control commands or configuration updates</dd>
  </dl>
  
  <h3>Control Commands</h3>
  <p>Send string payload:</p>
  <ul>
    <li><code>"start"</code>: Start the server</li>
    <li><code>"stop"</code>: Stop the server</li>
    <li><code>"restart"</code>: Restart the server</li>
    <li><code>"startdemo"</code>: Start demo data generation</li>
    <li><code>"stopdemo"</code>: Stop demo data generation</li>
    <li><code>"reset"</code>: Reset demo counter to 0</li>
  </ul>
  
  <h3>Configuration Updates</h3>
  <p>Send object payload to update configuration:</p>
  <pre>
msg.payload = {
  pattern: "sine",      // Data pattern
  interval: 2000,       // Update interval (ms)
  min: 0,              // Minimum value
  max: 1000,           // Maximum value
  device: "motor",     // Device simulation type
  errorRate: 0.05      // 5% error rate
}
  </pre>
  
  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">object</span></dt>
    <dd>Current demo server state including counter, pattern, and sample values</dd>
  </dl>
  
  <h3>Output Example</h3>
  <pre>
{
  counter: 123,
  pattern: "sine",
  device: "temperature",
  realistic: true,
  range: { min: 0, max: 65535 },
  errorRate: 0.0,
  samples: {
    coil_0: 1,
    discrete_0: 0,
    holding_0: 250,
    input_0: 1234
  }
}
  </pre>
</script>
