<script type="text/javascript">
  RED.nodes.registerType('modbus-client-tls', {
    category: 'config',
    defaults: {
      name: {value: ''},
      tcpHost: {value: 'localhost', required: true},
      tcpPort: {value: 8502, required: true, validate: RED.validators.number()},
      unit_id: {value: 0, validate: RED.validators.number()},
      commandDelay: {value: 1, validate: RED.validators.number()},
      clientTimeout: {value: 1000, validate: RED.validators.number()},
      reconnectTimeout: {value: 2000, validate: RED.validators.number()},
      reconnectOnTimeout: {value: true},
      bufferCommands: {value: true},
      parallelUnitIdsAllowed: {value: true},
      // TLS Configuration
      privateKey: {value: '', type: 'text'},
      certificate: {value: '', type: 'text'},
      ca: {value: '', type: 'text'},
      rejectUnauthorized: {value: false},
      servername: {value: ''},
      secureProtocol: {value: 'TLSv1_2_method'},
      checkServerIdentity: {value: true},
      autoConnect: {value: true},
      // Advanced features
      circuitBreakerEnabled: {value: true},
      circuitBreakerFailureThreshold: {value: 5, validate: RED.validators.number()},
      circuitBreakerSuccessThreshold: {value: 2, validate: RED.validators.number()},
      circuitBreakerTimeout: {value: 60000, validate: RED.validators.number()},
      circuitBreakerResetTimeout: {value: 30000, validate: RED.validators.number()},
      connectionPoolEnabled: {value: false},
      connectionPoolMaxConnections: {value: 10, validate: RED.validators.number()},
      connectionPoolMaxPerHost: {value: 3, validate: RED.validators.number()},
      diagnosticsEnabled: {value: false},
      diagnosticsMetricsInterval: {value: 60000, validate: RED.validators.number()},
      diagnosticsAlerting: {value: false},
      retryHandlerEnabled: {value: true},
      retryHandlerMaxRetries: {value: 3, validate: RED.validators.number()},
      retryHandlerInitialDelay: {value: 1000, validate: RED.validators.number()},
      retryHandlerMaxDelay: {value: 30000, validate: RED.validators.number()},
      retryHandlerBackoffMultiplier: {value: 2, validate: RED.validators.number()},
      // Logging
      queueLogEnabled: {value: false},
      stateLogEnabled: {value: false},
      failureLogEnabled: {value: false},
      showErrors: {value: false},
      showWarnings: {value: false},
      showLogs: {value: false}
    },
    label: function () {
      return this.name || "Modbus TLS " + this.tcpHost + ":" + this.tcpPort
    },
    info: function () {
      return "Modbus TLS Client with secure encrypted connection and advanced features."
    }
  })
</script>

<script type="text/x-red" data-help-name="modbus-client-tls">
  <p>Modbus TLS Client for secure encrypted Modbus TCP communication.</p>
  
  <h3>Features</h3>
  <ul>
    <li>TLS/SSL encryption for secure communication</li>
    <li>Client certificate authentication support</li>
    <li>Circuit breaker for failure protection</li>
    <li>Automatic retry with exponential backoff</li>
    <li>Connection pooling (optional)</li>
    <li>Comprehensive diagnostics and monitoring</li>
  </ul>
  
  <h3>TLS Configuration</h3>
  <p>The TLS client supports various security configurations:</p>
  <ul>
    <li><b>Server Verification Only</b>: Provide CA certificate to verify server</li>
    <li><b>Mutual TLS</b>: Provide client certificate and key for authentication</li>
    <li><b>Self-Signed Certificates</b>: Disable "Reject Unauthorized" for testing</li>
  </ul>
  
  <h3>Circuit Breaker</h3>
  <p>Protects against cascading failures by temporarily blocking connections after repeated failures.</p>
  
  <h3>Retry Handler</h3>
  <p>Automatically retries failed operations with configurable exponential backoff.</p>
  
  <h3>Input Messages</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">string</span></dt>
    <dd>Control commands: "connect", "disconnect", "reconnect"</dd>
  </dl>
  
  <h3>Status</h3>
  <p>The node shows connection status:</p>
  <ul>
    <li><b>Green</b>: Connected</li>
    <li><b>Yellow</b>: Connecting or circuit breaker half-open</li>
    <li><b>Red</b>: Disconnected, error, or circuit breaker open</li>
  </ul>
