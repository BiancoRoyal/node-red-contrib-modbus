name: "Snyk Vulnerability Analysis"
on:
  push:
    branches:
      - 6-additional-github-actions
      - main
  pull_request:
    types:
      - synchronize
      - opened
jobs:
  snyk:
    # Dependabot and fork pull requests get no SNYK_TOKEN; the Snyk app check covers them.
    if: github.event_name == 'push' || (github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run Snyk vulnerability scan
        uses: snyk/actions/node@11b673cfb4b0dc0d860a1323caa199d54950dcce # master as of 2026-10-20
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: monitor
