name: Build and publish
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - develop
      - development
      - alpha
      - beta
      - master
      - main
      # Work branches get the full CI on every push, no pull request needed.
      - 'support/**'
      - 'release/**'
      - 'hotfix/**'
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'
  # Re-run the release pipeline from master by hand (e.g. after fixing npm Trusted Publishing).
  workflow_dispatch:

# Least privilege: jobs get read-only access unless they list more below.
permissions:
  contents: read

# New pushes cancel superseded PR/branch runs; a running master release is never cancelled.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# Third-party actions are pinned to commit SHAs (the comment names the tag they resolve to);
# Dependabot (github-actions ecosystem) keeps them current.
jobs:
  build:
    runs-on: ubuntu-latest
    # Chaos + FSM + load suites need room; hang must fail the job, not burn the runner.
    timeout-minutes: 45
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      # npm ci installs exactly what package-lock.json pins (fails when it is out of sync)
      - run: npm ci
      - run: npm run test:ci
      - run: npm run build
      # The release tarball is built here, in a job without publish rights, and published
      # unchanged by the publish job. Scripts are skipped: build already ran.
      - name: Pack the npm tarball
        if: matrix.node == 24
        run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.node == 24
        with:
          name: npm-tarball
          path: node-red-contrib-modbus-*.tgz
          retention-days: 7
          if-no-files-found: error

  # Coverage gate: nyc.config.js sets check-coverage with the minimum thresholds, so this
  # job fails when coverage drops. The release below waits for it.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run coverage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: ignore

  # Supply chain gate: what users install (production dependencies) must stay free of
  # high/critical advisories, and yarn.lock must match package.json so npm and Yarn users
  # get the same installation as package-lock.json.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
      - name: yarn.lock is in sync with package.json
        run: yarn install --frozen-lockfile --ignore-scripts --ignore-engines --non-interactive

  publish:
    runs-on: ubuntu-latest
    needs: [build, coverage, audit]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    # OIDC Trusted Publishing — classic NPM_TOKEN was revoked by npm (Dec 2025).
    # REQUIRED once on https://www.npmjs.com/package/node-red-contrib-modbus/access
    # → Trusted Publisher → GitHub Actions:
    #   Organization or user: BiancoRoyal
    #   Repository: node-red-contrib-modbus
    #   Workflow filename: build.yml
    #   Allowed actions: npm publish
    permissions:
      id-token: write
      # tag + GitHub release after the npm publish
      contents: write
    steps:
      # Checkout only to read package.json and CHANGELOG.md. No dependency is installed and
      # no repository code runs in this job: it holds the publish rights.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Trusted Publishing: Node >= 22.14, npm >= 11.5.1
          node-version: 24
      # master is released only when package.json carries a version that is not on npm yet.
      # Every other push to master ends here successfully instead of failing on E403.
      - name: Check whether this version is already published
        id: version
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION is already on npm — nothing to release"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION is new — releasing"
          fi
          # Release notes come from the committed CHANGELOG section
          awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 { found = 1; next } /^## \[/ { found = 0 } found' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if [ ! -s "$RUNNER_TEMP/release-notes.md" ]; then
            echo "Release v$VERSION" > "$RUNNER_TEMP/release-notes.md"
          fi
      - name: Ensure npm supports OIDC trusted publishing
        if: steps.version.outputs.publish == 'true'
        run: |
          npm install -g npm@latest
          npm --version
          node --version
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "ACTIONS_ID_TOKEN_REQUEST_URL missing — id-token: write did not take effect"
            exit 1
          fi
          echo "OIDC token request URL is present"
      # The tarball was built and tested on this commit in the build job.
      - name: Download the tarball built from this commit
        if: steps.version.outputs.publish == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/tarball
      - name: Verify the tarball matches package.json
        if: steps.version.outputs.publish == 'true'
        env:
          EXPECTED: ${{ steps.version.outputs.name }}@${{ steps.version.outputs.version }}
        run: |
          TARBALL=$(ls "$RUNNER_TEMP"/tarball/*.tgz)
          ACTUAL=$(tar -xzOf "$TARBALL" package/package.json | node -p "const p=JSON.parse(require('fs').readFileSync(0,'utf8')); p.name + '@' + p.version")
          echo "tarball: $ACTUAL, expected: $EXPECTED"
          [ "$ACTUAL" = "$EXPECTED" ]
          tar -tzf "$TARBALL" | grep -q '^package/modbus/modbus-client.js$'
      # Never set NODE_AUTH_TOKEN here — empty/legacy tokens bypass OIDC → ENEEDAUTH/E404.
      - name: Publish to npm (OIDC)
        if: steps.version.outputs.publish == 'true'
        run: |
          unset NODE_AUTH_TOKEN NPM_TOKEN
          npm publish "$(ls "$RUNNER_TEMP"/tarball/*.tgz)" --access public --allow-remote=root --ignore-scripts
      - name: Create git tag and GitHub release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --latest
          fi
