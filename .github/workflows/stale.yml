name: 'Close stale issues and PRs'
on:
  schedule:
    - cron: '30 1 * * *'

permissions: {}

jobs:
  stale:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      issues: write
      pull-requests: write
      # actions/stale keeps its processing state in the Actions cache
      actions: write
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          stale-issue-message: 'This issue is stale because it has been open 60 days with no activity. It will be closed in 30 days, but can be saved by removing the stale label or commenting.'
          days-before-stale: 60
          days-before-close: 30
          # pull requests are reviewed by hand, security reports never go stale
          days-before-pr-stale: -1
          days-before-pr-close: -1
          exempt-issue-labels: 'security,pinned,confirmed'
