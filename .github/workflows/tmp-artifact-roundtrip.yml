# TEMPORARY: checks the release tarball hand-off (upload v7 -> download v8) before #596 lands.
name: Temporary artifact roundtrip
on:
  push:
    branches:
      - chore/actions-majors
permissions:
  contents: read
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarball
          path: node-red-contrib-modbus-*.tgz
          retention-days: 1
          if-no-files-found: error
  verify:
    runs-on: ubuntu-latest
    needs: pack
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/tarball
      - name: Verify the tarball like the publish job
        run: |
          ls -la "$RUNNER_TEMP"/tarball
          EXPECTED="$(node -p "require('./package.json').name + '@' + require('./package.json').version")"
          TARBALL=$(ls "$RUNNER_TEMP"/tarball/*.tgz)
          ACTUAL=$(tar -xzOf "$TARBALL" package/package.json | node -p "const p=JSON.parse(require('fs').readFileSync(0,'utf8')); p.name + '@' + p.version")
          echo "tarball: $ACTUAL, expected: $EXPECTED"
          [ "$ACTUAL" = "$EXPECTED" ]
          tar -tzf "$TARBALL" | grep -q '^package/modbus/modbus-client.js$'
          npm publish "$TARBALL" --dry-run --ignore-scripts
