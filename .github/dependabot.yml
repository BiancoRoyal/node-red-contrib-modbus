version: 2
updates:
  # The pull request has to update package-lock.json and yarn.lock together: npm ci fails on a
  # stale package-lock.json and the CI audit job fails when yarn.lock drifts from package.json.
  # If Dependabot only updates yarn.lock, redo the update locally with npm (it updates both).
  - package-ecosystem: 'npm'
    directory: '/'
    target-branch: "master"
    schedule:
      interval: "monthly"
    # new releases wait before they are proposed (compromised publishes are usually pulled fast)
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "modbus*"
      - dependency-name: "*modbus*"
  # Actions are pinned to commit SHAs in .github/workflows; Dependabot moves the pins.
  - package-ecosystem: 'github-actions'
    directory: '/'
    target-branch: "master"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
