[req]
distinguished_name = req_distinguished_name
req_extensions = v3_req
prompt = no

[req_distinguished_name]
C = US
ST = TestState
L = TestCity
O = ModbusTest
OU = Testing
CN = modbus-server

[v3_req]
keyUsage = keyEncipherment, dataEncipherment
extendedKeyUsage = serverAuth
subjectAltName = @alt_names

[alt_names]
DNS.1 = localhost
DNS.2 = modbus-server
DNS.3 = *.local
IP.1 = 127.0.0.1
IP.2 = ::1
IP.3 = 10.0.0.0/8
IP.4 = 172.16.0.0/12
IP.5 = 192.168.0.0/16
